<!DOCTYPE html>
<html>

<body>

<h2>Trap Game WebSocket Test</h2>

<input id="token" placeholder="JWT Token">

<button onclick="connect()">
Connect
</button>

<br><br>

<button onclick="moveRight()">
Move Right
</button>


<pre id="output"></pre>


<script>

let socket;


function log(message){
    document.getElementById("output").textContent += 
        message + "\n";
}



function connect(){

    let token = document.getElementById("token").value;


    socket = new WebSocket(
        `ws://127.0.0.1:8000/ws?token=${token}`
    );


    socket.onopen = () => {
        log("Connected");
    };


    socket.onmessage = (event)=>{

        let data = JSON.parse(event.data);

        log(
            "SERVER: " + JSON.stringify(data)
        );

    };


    socket.onclose = ()=>{
        log("Disconnected");
    };


    socket.onerror = (error)=>{
        log("ERROR");
        console.log(error);
    }

}



function moveRight(){

    socket.send(
        JSON.stringify({

            type:"MOVE",

            position:{
                x:1,
                y:0
            }

        })
    );

}

</script>


</body>

</html>
